<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=block" rel="stylesheet">
<style>
/* Source for assets/og-hanuman-purva.jpg (1200x630 share image). Render: headless Chrome/Edge at 1200x630, then save as JPEG. */
:root{--hpl:#821D1D;--hpl-deep:#5E1414;--ply-a:#E6C998;--ply-b:#C99D63;--ply-c:#EDD5AA;--ply-d:#B4874F;--on-hpl-2:#F2D9D4;--white-hpl:#F5F3EF}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#161413}
.photo{position:absolute;inset:0;background:url(../../assets/hero-purva.jpg) 50% 60%/cover}
.photo::after{content:"";position:absolute;inset:0;background:rgba(22,20,19,.12)}
/* translucent maroon HPL board like the site hero; top right, over the empty wall, so the PURVA pillars and letters stay visible */
.board{position:absolute;right:72px;top:64px;width:520px;background:rgba(130,29,29,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;padding:34px 38px 34px;font-family:Montserrat,sans-serif}
.board::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:14px;background:repeating-linear-gradient(180deg,var(--ply-a) 0 1.5px,var(--ply-b) 1.5px 2.5px,var(--ply-c) 2.5px 4px,var(--ply-d) 4px 5px);box-shadow:inset 0 -2px 0 var(--hpl-deep)}
.board::after{content:"";position:absolute;top:-14px;bottom:0;left:100%;width:14px;background:repeating-linear-gradient(90deg,var(--ply-a) 0 1.5px,var(--ply-b) 1.5px 2.5px,var(--ply-c) 2.5px 4px,var(--ply-d) 4px 5px);box-shadow:inset 2px 0 0 var(--hpl-deep)}
.logo{display:block;height:52px;width:auto;margin-bottom:22px}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:40px;line-height:1.1;letter-spacing:-.02em}
p{margin-top:14px;font-weight:600;font-size:22px;line-height:1.35;color:var(--on-hpl-2)}
.tag{position:absolute;right:0;bottom:-46px;background:var(--white-hpl);color:#1C1A18;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px}
</style></head>
<body>
  <div class="photo"></div>
  <div class="board">
    <img class="logo" src="../../assets/logo-pill.png" alt="">
    <h1>Booth pameran, pop&#8209;up &amp; interior komersial</h1>
    <p>Didesain dan dibangun satu tim di Jakarta &amp; Tangerang, sejak 2015.</p>
    <span class="tag">Best Booth Design IIPE ×2</span>
  </div>
</body></html>
